[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-cas-manager"
version = "0.1.0"
description = "Gestor de escritorio para calculadoras TI-Nspire CX CAS en Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.7", "pycryptodome>=3.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
texas-cas-manager = "texas_cas_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
